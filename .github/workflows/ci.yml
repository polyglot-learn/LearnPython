name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  samples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run every sample
        run: python .github/scripts/run_all.py

  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DIRECTORY.md is up to date
        run: python .github/scripts/gen_directory.py --check
